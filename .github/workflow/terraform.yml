name: Terraform Preprod Pipeline

on:
  push:
    branches:
      - feature/pipeline

  pull_request:
    branches:
      - main

jobs:
  terraform:
    name: Terraform Validation and Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environment/preprod

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan